<!DOCTYPE html>
<html lang="pt-BR" data-theme="escuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#15171c">
  <title>Central de Arquivos — Esquemas e Ligações</title>
  <meta name="description" content="Central de arquivos de manutenção: esquemas, ligações, manuais e documentos técnicos.">
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23312e81'/%3E%3Ctext y='.84em' x='50%25' text-anchor='middle' font-size='55'%3E🧩%3C/text%3E%3C/svg%3E">
  <!-- Open Graph -->
  <meta property="og:title" content="Central de Arquivos — Esquemas e Ligações">
  <meta property="og:description" content="Todos os esquemas, manuais e documentos de manutenção das nossas máquinas — em um só lugar.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://welloliver1974.github.io/esquemas-ligacoes/">
  <meta property="og:image" content="https://welloliver1974.github.io/esquemas-ligacoes/logo.png">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    /* anti-flash: aplica o tema salvo antes da primeira pintura */
    (function () {
      try {
        var t = localStorage.getItem('tema') || 'escuro';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'escuro');
      }
    })();
  </script>
  <style>
    /* ============ TOKENS ============ */
    :root {
      --radius: 8px;
      --radius-sm: 6px;
      --transition: .15s ease;
      --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
    }

    /* ----- ESCURO (padrão) ----- */
    [data-theme="escuro"] {
      --bg: #15171c;
      --topbar: #1a1d23;
      --surface: #1c1f26;
      --surface-2: #23272f;
      --border: #2b3038;
      --border-strong: #3a414c;
      --text: #e7e9ee;
      --text-soft: #99a2b0;
      --accent: #6aa8e8;
      --accent-ink: #10151c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .25);
      --footer-bg: #101216;
    }

    /* ----- CLARO ----- */
    [data-theme="claro"] {
      --bg: #f3f4f6;
      --topbar: #ffffff;
      --surface: #ffffff;
      --surface-2: #f6f7f9;
      --border: #e3e6ea;
      --border-strong: #c9ced6;
      --text: #1b2028;
      --text-soft: #5d6672;
      --accent: #1f6feb;
      --accent-ink: #ffffff;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05);
      --footer-bg: #e9ebef;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      font-family: var(--sans);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      background: var(--bg);
      transition: background var(--transition), color var(--transition);
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ===== TOPBAR (com busca) ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      background: var(--topbar);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition), border-color var(--transition);
    }
    .brand { display: flex; align-items: center; min-width: 0; }

    .logo {
      display: block;
      width: 200px;
      max-width: 46vw;
      height: auto;
      aspect-ratio: 243 / 64;
      object-fit: contain;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 440px;
      margin-left: auto;
    }
    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-soft);
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .search-wrap input::placeholder { color: var(--text-soft); }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .theme-btn {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }
    .theme-btn svg { width: 18px; height: 18px; }
    .theme-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }

    /* ===== CABEÇALHO DA PÁGINA ===== */
    .page-head {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 24px 4px;
    }
    .page-head h1 {
      font-size: clamp(24px, 4vw, 30px);
      font-weight: 600;
      letter-spacing: -.4px;
    }
    .page-head > p {
      margin-top: 8px;
      max-width: 62ch;
      font-size: 15px;
      color: var(--text-soft);
    }

    .head-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-family: var(--mono);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .3px;
      text-transform: uppercase;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      cursor: pointer;
      transition: color var(--transition), border-color var(--transition), background var(--transition);
    }
    .chip:hover { color: var(--text); border-color: var(--border-strong); }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .total-info {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-soft);
      font-variant-numeric: tabular-nums;
    }

    /* ===== CONTEÚDO ===== */
    main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 72px; }

    section { margin-bottom: 40px; }
    .section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      opacity: 0;
      transition: opacity .15s ease;
    }
    section.in-view .section-head { opacity: 1; }

    .cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--cat, var(--accent));
      flex-shrink: 0;
    }
    .section-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -.2px; }
    .section-head .qtd {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 7px;
      font-variant-numeric: tabular-nums;
    }

    /* ===== ÍNDICE (linhas) ===== */
    .rows {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      border-left: 3px solid var(--cat, var(--accent));
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      opacity: 0;
      transition: opacity .15s ease, background var(--transition);
    }
    section.in-view .row { opacity: 1; }
    .rows .row:last-child { border-bottom: none; }
    .row:hover { background: var(--surface-2); }

    .row-icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: var(--text-soft);
      transition: color var(--transition);
    }
    .row:hover .row-icon { color: var(--cat, var(--accent)); }
    .row-icon svg { width: 22px; height: 22px; }

    .row-body { flex: 1; min-width: 0; }
    .row-body h3 { font-size: 14.5px; font-weight: 600; line-height: 1.35; }
    .row-body p { margin-top: 2px; font-size: 13px; color: var(--text-soft); }

    .row-meta { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .row .tipo {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
    }
    .row .arrow {
      color: var(--text-soft);
      font-size: 15px;
      transition: color var(--transition), transform var(--transition);
    }
    .row:hover .arrow { color: var(--cat, var(--accent)); transform: translateX(3px); }

    .row mark {
      background: color-mix(in srgb, var(--cat, var(--accent)) 24%, transparent);
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 600;
    }

    .no-results {
      display: none;
      text-align: center;
      padding: 48px 20px;
      color: var(--text-soft);
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      font-size: 14.5px;
    }
    .no-results.visible { display: block; }

    /* ===== RODAPÉ ===== */
    footer {
      background: var(--footer-bg);
      color: var(--text-soft);
      text-align: center;
      padding: 26px 16px;
      font-size: 13px;
      border-top: 1px solid var(--border);
      transition: background var(--transition);
    }
    footer strong { color: var(--text); font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .row, .section-head { opacity: 1 !important; }
    }

    /* ===== TABLET E MOBILE ===== */
    @media (max-width: 700px) {
      .topbar { flex-wrap: wrap; padding: 10px 14px; gap: 10px; }
      .theme-btn { margin-left: auto; }
      .search-wrap { order: 3; flex-basis: 100%; max-width: none; margin-left: 0; }

      .page-head { padding: 24px 16px 4px; }
      main { padding: 24px 16px 60px; }
      .section-head h2 { font-size: 16.5px; }
      .row { padding: 12px; gap: 11px; }
      .row-body h3 { font-size: 14px; }

      .chips {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
        scrollbar-width: thin;
      }
      .chip { flex-shrink: 0; }
    }

    /* ===== BOTÃO VOLTAR AO TOPO ===== */
    .to-top {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 60;
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: opacity .2s, transform .2s, visibility .2s, background var(--transition);
    }
    .to-top svg { width: 18px; height: 18px; }
    .to-top.show { opacity: 1; visibility: visible; transform: none; }
    .to-top:hover { background: var(--surface-2); }
  </style>
</head>
<body>

  <!-- ============ TOPBAR ============ -->
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="logo.png" alt="Logo — Diagnóstic Medical" onerror="this.onerror=null;this.src='logo.jpg'">
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="busca" placeholder="Buscar por máquina, esquema, documento..." autocomplete="off">
    </div>
    <button id="tema-toggle" class="theme-btn" type="button" aria-label="Alternar tema"></button>
  </header>

  <!-- ============ CABEÇALHO ============ -->
  <section class="page-head">
    <h1>Esquemas e Ligações</h1>
    <p>Documentos de manutenção das nossas máquinas — esquemas, manuais e procedimentos. Clique para abrir direto do Google Drive.</p>

    <div class="head-meta">
      <div class="chips" id="chips"></div>
      <div class="total-info" id="total-info" aria-live="polite"></div>
    </div>
  </section>

  <!-- ============ CONTEÚDO (gerado pelo JS) ============ -->
  <main id="conteudo"></main>

  <!-- ============ RODAPÉ ============ -->
  <footer>
    <strong>Central de Arquivos</strong> · Esquemas e Ligações · Manutenção · <span id="ano"></span>
  </footer>

  <!-- ============ VOLTAR AO TOPO ============ -->
  <button class="to-top" id="to-top" type="button" aria-label="Voltar ao topo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
  </button>

  <script>
    /* ============================================================
       👉 COMO ADICIONAR UM NOVO ARQUIVO
       Copie uma linha do bloco ARQUIVOS abaixo e troque os campos:
         cat   → categoria (manuais | esquemas | pedais | display | agua | versoes)
         nome  → nome do arquivo
         desc  → uma descrição curta
         link  → o link de compartilhamento do arquivo no Drive
         tipo  → pdf | png | docx (define o ícone e o selo)
       ============================================================ */

    const CATEGORIAS = [
      { id: 'manuais',  nome: 'Manuais',              icon: '📘', cor: '#2563eb' },
      { id: 'esquemas', nome: 'Esquemas e Circuitos', icon: '🧩', cor: '#7c3aed' },
      { id: 'pedais',   nome: 'Pedais e Conectores',  icon: '🔌', cor: '#f97316' },
      { id: 'display',  nome: 'Display e Configuração', icon: '🖥️', cor: '#14b8a6' },
      { id: 'agua',     nome: 'Sistema de Água (Tripter)', icon: '💧', cor: '#06b6d4' },
      { id: 'versoes',  nome: 'Versões e Downgrade',  icon: '🔄', cor: '#ec4899' },
    ];

    const ARQUIVOS = [
      // ===== MANUAIS =====
      { cat: 'manuais', nome: 'Manual Digiscope RX2', desc: 'Manual completo da Digiscope RX2.', link: 'https://drive.google.com/file/d/1rZBFJsh_Ua50ofGFVlVigLrxDlRSXJPH/view', tipo: 'pdf' },
      { cat: 'manuais', nome: 'Manual Tripter Compact', desc: 'Manual do Tripter Compact.', link: 'https://drive.google.com/file/d/1-3ibEl0tVHLpJD_8Zuuv3pWfgYCABlYF/view', tipo: 'pdf' },
      { cat: 'manuais', nome: 'Controle HIWIN', desc: 'Documento de controle do HIWIN (formato Word).', link: 'https://drive.google.com/file/d/1lYzaGv_U9YuzEeOq4EblEMLTCWuZF1Dt/view', tipo: 'docx' },
      { cat: 'manuais', nome: 'Medições Tensão — Fonte Alta Tensão', desc: 'Procedimento de medição de tensão da fonte de alta tensão do intensificador.', link: 'https://drive.google.com/file/d/1XjkfpArIVbb-YwTVRVu184eulUxYSm4g/view', tipo: 'pdf' },

      // ===== ESQUEMAS E CIRCUITOS =====
      { cat: 'esquemas', nome: 'Circuito de Pulso', desc: 'Esquema do circuito de pulso.', link: 'https://drive.google.com/file/d/1xtTJ5Ozd1C-pEX2ENfdSIwq4tj65PklB/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'Circuito de Pulso (v2)', desc: 'Segunda versão do esquema do circuito de pulso.', link: 'https://drive.google.com/file/d/1sg2yFrgK29AYsHyN3Ni2NgcotIwIWZj/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'Circuito Mesa', desc: 'Esquema do circuito da mesa.', link: 'https://drive.google.com/file/d/138SKt4GpRiU_YnvRWGxt0bCQvD64Fqu8/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'Circuito Mesa (v2)', desc: 'Segunda versão do esquema do circuito da mesa.', link: 'https://drive.google.com/file/d/17kAMZ6h626Jsc79BNddotJ5eMEjwmiab/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'PCB 120 Mod', desc: 'Esquema da placa PCB 120 modificada.', link: 'https://drive.google.com/file/d/1LgRfBU3DifhDv-OqLkTg8e7kKYyu5B3S/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'Cabo do 08 para PCB 120', desc: 'Esquema do cabo do 08 para a PCB 120.', link: 'https://drive.google.com/file/d/17O2phnq7nP0S2UFIIKDRET4cBahdlPtV/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'Litho Barramento Principal', desc: 'Esquema do barramento principal da Litho.', link: 'https://drive.google.com/file/d/1yOCjy1BTgNpywIBDj3lC3v3SDPKVg5BW/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'Interlock Litho', desc: 'Esquema do interlock da Litho.', link: 'https://drive.google.com/file/d/1BXgK1NrOLcbF0FFXlSJyVZ7to-9EYcyw/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'Esquema Cabo ED1000', desc: 'Esquema do cabo ED1000.', link: 'https://drive.google.com/file/d/1WzOpqOtuSU3wsesrS1oEOlZkj_brK0GO/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'Esquema Conector do Blue', desc: 'Esquema do conector do Blue.', link: 'https://drive.google.com/file/d/1_USiJ2Kh4iJmFsswbQmmGOIL0tPc-lQt/view', tipo: 'pdf' },
      { cat: 'esquemas', nome: 'Esquema Ligação Ampola RX', desc: 'Esquema de ligação da ampola RX.', link: 'https://drive.google.com/file/d/1aqUx3hdB7PNn070RuNl_b9anIMe3PUM2/view', tipo: 'pdf' },

      // ===== PEDAIS E CONECTORES =====
      { cat: 'pedais', nome: 'Conector Pedal Cyber Ho', desc: 'Ligação do conector do pedal Cyber Ho.', link: 'https://drive.google.com/file/d/1zX8tf7fg65Lg7wKpQsMDXVBYShSDA2eh/view', tipo: 'pdf' },
      { cat: 'pedais', nome: 'Conector Pedal Litho', desc: 'Ligação do conector do pedal Litho.', link: 'https://drive.google.com/file/d/1T5WtOQhASTI7dUtK06LYXwgWdxER8_uQ/view', tipo: 'pdf' },
      { cat: 'pedais', nome: 'Medidas Pedal EMS Laserclast 35', desc: 'Medidas do pedal da EMS Laserclast 35.', link: 'https://drive.google.com/file/d/1bCAViN3SI5_g1Q3yo_V4DEAd-ojZUzsd/view', tipo: 'pdf' },
      { cat: 'pedais', nome: 'Fiação Controle Remoto LAP4 (HIWIN)', desc: 'Fiação do controle remoto LAP4 do HIWIN.', link: 'https://drive.google.com/file/d/1ViMJ6OTJ1ud5DAL9VkpiZlPbVpPYDDKB/view', tipo: 'pdf' },

      // ===== DISPLAY E CONFIGURAÇÃO =====
      { cat: 'display', nome: 'Configuração Display Nusp', desc: 'Guia de configuração do display Nusp.', link: 'https://drive.google.com/file/d/1FevQuZelPN82SxmhUO_IZnOF6QJ6QKdI/view', tipo: 'pdf' },
      { cat: 'display', nome: 'Ligação Nusp com Display', desc: 'Esquema de ligação do Nusp com o display.', link: 'https://drive.google.com/file/d/17i18KJemuAF_g4hTwvdJ3ycSJ5vqC7C6/view', tipo: 'pdf' },

      // ===== SISTEMA DE ÁGUA (TRIPTER) =====
      { cat: 'agua', nome: 'Sistema de Água Tripter 0022', desc: 'Esquema do sistema de água do Tripter (0022).', link: 'https://drive.google.com/file/d/1hVa2vB004b_bY9-DqmZRfNxVKQYiTwhE/view', tipo: 'pdf' },
      { cat: 'agua', nome: 'Sistema de Água Tripter 0023', desc: 'Esquema do sistema de água do Tripter (0023).', link: 'https://drive.google.com/file/d/1rUGZtIfkACDSL2WZ6DTZbo6MG-xAU4AG/view', tipo: 'pdf' },
      { cat: 'agua', nome: 'Sistema de Água 0022 (imagem)', desc: 'Imagem do sistema de água (0022).', link: 'https://drive.google.com/file/d/1FMBTq225KTdKPazbRlAnZXCwUIeu9vNH/view', tipo: 'png' },
      { cat: 'agua', nome: 'Sistema de Água 0023 (imagem)', desc: 'Imagem do sistema de água (0023).', link: 'https://drive.google.com/file/d/1Nels3jrds_ik228XxbRhGoEDqilhyb70/view', tipo: 'png' },

      // ===== VERSÕES E DOWNGRADE =====
      { cat: 'versoes', nome: 'Downgrade Tripter Compact', desc: 'Procedimento de downgrade do Tripter Compact.', link: 'https://drive.google.com/file/d/1iaPhY1ha6Bb8K1lvzmdLGlGXV37G9QAL/view', tipo: 'pdf' },
      { cat: 'versoes', nome: 'Downgrade Tripter Compact (imagem)', desc: 'Imagem do procedimento de downgrade do Tripter Compact.', link: 'https://drive.google.com/file/d/1ZvEUFwlEVS-fGeOhOxtcJ5PfB3cGnk1Y/view', tipo: 'png' },
    ];

    /* ============ ÍCONES SVG POR TIPO ============ */
    function fileIcon(inner) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>'
        + '<path d="M14 3v5h5"/>' + inner + '</svg>';
    }
    const IMG_INNER = '<circle cx="10" cy="12" r="1"/><path d="M8 18l2.5-3 1.5 1.5 2-2.5 2 4z"/>';
    const ICONES = {
      pdf: fileIcon('<path d="M9 13h6M9 16h4"/>'),
      png: fileIcon(IMG_INNER),
      jpg: fileIcon(IMG_INNER),
      docx: fileIcon('<path d="M9 12h6M9 15h6M9 18h3"/>'),
      doc: fileIcon('<path d="M9 12h6M9 15h6M9 18h3"/>'),
      default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    };

    /* ============ RENDERIZAÇÃO ============ */
    const conteudo = document.getElementById('conteudo');
    const chipsEl = document.getElementById('chips');

    // chips de categoria
    const chipHtml = ['todos']
      .concat(CATEGORIAS.map(c => c.id))
      .map((id, i) => {
        const nome = id === 'todos' ? 'Todos' : (CATEGORIAS.find(c => c.id === id) || {}).nome;
        return `<button class="chip${i === 0 ? ' active' : ''}" data-filter="${id}">${nome}</button>`;
      }).join('');
    chipsEl.innerHTML = chipHtml;

    // monta as seções
    function renderSections() {
      conteudo.innerHTML = CATEGORIAS.map(cat => {
        const itens = ARQUIVOS.filter(a => a.cat === cat.id);
        if (!itens.length) return '';
        const rows = itens.map(a => `
          <a class="row" href="${a.link}" target="_blank" rel="noopener"
             style="--cat:${cat.cor}"
             data-search="${(a.nome + ' ' + a.desc + ' ' + cat.nome).toLowerCase()}">
            <span class="row-icon">${ICONES[a.tipo] || ICONES.default}</span>
            <span class="row-body">
              <h3>${a.nome}</h3>
              <p>${a.desc}</p>
            </span>
            <span class="row-meta">
              <span class="tipo">${a.tipo}</span>
              <span class="arrow" aria-hidden="true">→</span>
            </span>
          </a>`).join('');
        return `
          <section data-cat="${cat.id}" style="--cat:${cat.cor}">
            <div class="section-head">
              <span class="cat-dot" aria-hidden="true"></span>
              <h2>${cat.nome}</h2>
              <span class="qtd">${itens.length}</span>
            </div>
            <div class="rows">${rows}</div>
          </section>`;
      }).join('');
    }

    renderSections();

    /* ============ BUSCA + FILTRO ============ */
    const busca = document.getElementById('busca');
    const chips = document.querySelectorAll('.chip');
    const noResults = document.createElement('div');
    noResults.className = 'no-results';
    noResults.textContent = 'Nenhum arquivo encontrado. Tente outro termo de busca.';
    conteudo.appendChild(noResults);

    /* escapa HTML e envolta o termo em <mark> (case-insensitive) */
    function destacar(texto, termo) {
      const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
      const safe = esc(texto);
      if (!termo) return safe;
      const re = new RegExp(termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      return safe.replace(re, m => `<mark>${m}</mark>`);
    }

    const totalInfoEl = document.getElementById('total-info');

    function filtrar() {
      const termo = busca.value.trim().toLowerCase();
      const filtro = document.querySelector('.chip.active').dataset.filter;
      const catNome = (CATEGORIAS.find(c => c.id === filtro) || {}).nome;
      const temFiltro = filtro && filtro !== 'todos';
      const temBusca = !!termo;

      let totalVisiveis = 0;

      document.querySelectorAll('section[data-cat]').forEach(sec => {
        const catId = sec.dataset.cat;
        const passouCategoria = filtro === 'todos' || catId === filtro;
        let visiveis = 0;

        sec.querySelectorAll('.row').forEach(row => {
          const texto = row.dataset.search;
          const visivel = passouCategoria && (!temBusca || texto.includes(termo));
          row.style.display = visivel ? '' : 'none';
          if (visivel) visiveis++;
        });

        sec.style.display = (passouCategoria && visiveis > 0) ? '' : 'none';
        totalVisiveis += visiveis;
      });

      // ---- destaque do termo nas linhas visíveis ----
      document.querySelectorAll('.row').forEach(row => {
        const h3 = row.querySelector('h3');
        const p = row.querySelector('p');
        [h3, p].forEach(el => {
          if (!el) return;
          if (!el.dataset.orig) el.dataset.orig = el.textContent;
          el.innerHTML = destacar(el.dataset.orig, (row.style.display !== 'none') ? temBusca ? termo : '' : '');
        });
      });

      // ---- contador total-info ----
      let msg;
      const n = totalVisiveis;
      if (n === 0) {
        msg = 'Nenhum resultado encontrado';
      } else if (temFiltro && temBusca) {
        msg = `${n} ${n === 1 ? 'resultado' : 'resultados'} em ${catNome}`;
      } else if (temBusca) {
        msg = `${n} ${n === 1 ? 'resultado' : 'resultados'}`;
      } else if (temFiltro) {
        msg = `${n} ${n === 1 ? 'arquivo' : 'arquivos'} em ${catNome}`;
      } else {
        msg = `${ARQUIVOS.length} arquivos disponíveis`;
      }
      totalInfoEl.textContent = msg;

      // ---- título da aba ----
      if (temBusca) document.title = `Busca: "${busca.value.trim()}" — Central de Arquivos`;
      else if (temFiltro) document.title = `${catNome} — Central de Arquivos`;
      else document.title = 'Central de Arquivos — Esquemas e Ligações';

      noResults.classList.toggle('visible', totalVisiveis === 0);
    }

    busca.addEventListener('input', filtrar);
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        filtrar();
      });
    });
    filtrar(); // mostra o total inicial

    /* ============ REVELA NO SCROLL ============ */
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in-view');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08 });

    document.querySelectorAll('section[data-cat]').forEach(s => io.observe(s));

    /* ============ TEMA (claro / escuro) ============ */
    const SVG_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    const SVG_LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

    const temaBtn = document.getElementById('tema-toggle');
    function atualizarIconeTema() {
      const t = document.documentElement.getAttribute('data-theme');
      temaBtn.innerHTML = t === 'escuro' ? SVG_SOL : SVG_LUA;
      temaBtn.setAttribute('aria-label', t === 'escuro' ? 'Ativar modo claro' : 'Ativar modo escuro');
      temaBtn.title = t === 'escuro' ? 'Mudar para modo claro' : 'Mudar para modo escuro';
    }
    temaBtn.addEventListener('click', () => {
      const atual = document.documentElement.getAttribute('data-theme');
      const novo = atual === 'escuro' ? 'claro' : 'escuro';
      document.documentElement.setAttribute('data-theme', novo);
      try { localStorage.setItem('tema', novo); } catch (e) {}
      atualizarIconeTema();
    });
    atualizarIconeTema();

    /* barra do navegador acompanha o tema (Android) */
    function atualizarThemeColor() {
      const meta = document.querySelector('meta[name="theme-color"]');
      if (!meta) return;
      meta.content = document.documentElement.getAttribute('data-theme') === 'escuro' ? '#15171c' : '#ffffff';
    }
    atualizarThemeColor();
    const obsTema = new MutationObserver(atualizarThemeColor);
    obsTema.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    /* ============ VOLTAR AO TOPO ============ */
    const toTop = document.getElementById('to-top');
    function toggleToTop() {
      toTop.classList.toggle('show', (window.scrollY || document.documentElement.scrollTop) > 500);
    }
    window.addEventListener('scroll', toggleToTop, { passive: true });
    toggleToTop();
    toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    /* ============ ANO NO RODAPÉ ============ */
    document.getElementById('ano').textContent = new Date().getFullYear();
  </script>

</body>
</html>
